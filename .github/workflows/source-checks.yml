name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Audit tracked source
        run: python3 tools/audit_source.py --report "$RUNNER_TEMP/source-audit.json"
      - name: Install component build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxext-dev
      - name: Configure source-only tests
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DSSNE_BUILD_LAUNCHER=OFF -DSSNE_BUILD_PORT=OFF -DSSNE_BUILD_TESTS=ON
      - name: Build components
        run: cmake --build build-ci --parallel 2
      - name: Test synthetic and component fixtures
        run: ctest --test-dir build-ci --output-on-failure
